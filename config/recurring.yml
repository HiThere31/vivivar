# Tareas programadas de Solid Queue (solo corren con el proceso de Solid Queue, es decir en producción)
production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  daily_photo_reminder:
    class: DailyReminderJob
    schedule: "0 20 * * * America/Costa_Rica"
