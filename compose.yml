name: vivivar

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: vivivar
      POSTGRES_PASSWORD: vivivar
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivivar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
